name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.artifact.outputs.run-id }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Validate version and select a verified main artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-version.mjs check "$RELEASE_TAG"
          node scripts/select-release-artifact.mjs

  build:
    needs: select
    if: needs.select.outputs.artifact-id == ''
    uses: ./.github/workflows/build.yml
    with:
      package-portable: true
      release-tag: ${{ github.ref_name }}

  publish:
    needs: [select, build]
    if: >-
      ${{ !cancelled() && needs.select.result == 'success' &&
          ((needs.select.outputs.artifact-id != '' && needs.build.result == 'skipped') ||
           (needs.select.outputs.artifact-id == '' && needs.build.result == 'success')) }}
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the verified main archive
        if: needs.select.outputs.artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.run-id }}
          artifact-ids: ${{ needs.select.outputs.artifact-id }}
          merge-multiple: true
          digest-mismatch: error
          path: artifacts
      - name: Download this run's verified archive
        if: needs.select.outputs.artifact-id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RouteDeck-windows-x64
          path: artifacts
      - name: Verify packaged version and source commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the checked-out tag commit' }
          $version = $env:RELEASE_TAG.Substring(1)
          ./scripts/assert-portable-origin.ps1 -Archive "artifacts/RouteDeck-$version-windows-x64.zip" -Version $version -SourceCommit $commit
      - name: Set up pinned Node for signing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Sign stable full portable update descriptor
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.repository == 'oda02/RouteDeck'
        env:
          ROUTEDECK_UPDATE_SIGNING_KEY: ${{ secrets.ROUTEDECK_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          node scripts/sign-update.mjs sign artifacts/RouteDeck-update.json "artifacts/RouteDeck-$version-windows-x64.zip" $version
          if ($LASTEXITCODE -ne 0) { throw 'Signed update descriptor validation failed' }
          $hash = (Get-FileHash -LiteralPath artifacts/RouteDeck-update.sig -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::AppendAllText((Join-Path $pwd 'artifacts/SHA256SUMS.txt'), "$hash  RouteDeck-update.sig`n", [Text.UTF8Encoding]::new($false))
      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/publish-release.ps1
