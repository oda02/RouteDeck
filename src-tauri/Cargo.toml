[package]
name = "routedeck"
version = "0.1.0"
description = "Portable-first Windows client for sing-box"
authors = ["RouteDeck contributors"]
edition = "2021"
rust-version = "1.89"
default-run = "routedeck"

[lib]
name = "routedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = { version = "=1.2.0", default-features = false, features = ["deserialize"] }
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinInet",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
