[package]
name = "routedeck"
version = "0.1.0"
description = "Portable-first Windows client for sing-box"
authors = ["RouteDeck contributors"]
edition = "2021"
rust-version = "1.88"
default-run = "routedeck"

[lib]
name = "routedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
url = "=2.5.8"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
